<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rizz Live | Host Policy Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#22083f;
  --deep2:#3a1266;
  --violet:#6a2c9e;
  --magenta:#d63bb0;
  --blue:#4d6bff;
  --skyblue:#7fd8ff;
  --gold:#f6c65a;
  --gold2:#e8a13a;
  --cream:#fff8ec;
  --ink:#2a0f45;
  --text:#fbf1ff;
  --text-dim:#dcc9ee;
  --glass:rgba(255,255,255,0.07);
  --glass-brd:rgba(255,255,255,0.16);
  --radius:22px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  min-height:100vh;
  font-family:'Nunito',sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 10%, rgba(214,59,176,0.55), transparent 45%),
    radial-gradient(circle at 85% 15%, rgba(77,107,255,0.5), transparent 50%),
    radial-gradient(circle at 50% 90%, rgba(106,44,158,0.6), transparent 55%),
    linear-gradient(160deg,#1c0736 0%, #2c0d4f 35%, #3a1266 65%, #241049 100%);
  background-attachment:fixed;
  overflow-x:hidden;
  position:relative;
}
body::before, body::after{
  content:'';
  position:fixed;
  border-radius:50%;
  filter:blur(2px);
  opacity:0.5;
  pointer-events:none;
  z-index:0;
}
body::before{
  width:14px;height:14px;
  background:radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,0));
  top:12%; left:8%;
  animation:floaty 9s ease-in-out infinite;
}
body::after{
  width:22px;height:22px;
  background:radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,0));
  top:70%; left:88%;
  animation:floaty 11s ease-in-out infinite reverse;
}
@keyframes floaty{
  0%,100%{transform:translateY(0px) translateX(0px);}
  50%{transform:translateY(-30px) translateX(14px);}
}
.bubble{
  position:fixed; border-radius:50%; pointer-events:none; z-index:0;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,0.55), rgba(255,255,255,0.03) 70%);
  border:1px solid rgba(255,255,255,0.25);
  animation:floaty 10s ease-in-out infinite;
}
.stage{position:relative; z-index:1; min-height:100vh;}
.hidden{display:none !important;}

/* ---------- LANGUAGE SELECT SCREEN ---------- */
#langScreen{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:40px 20px 60px; text-align:center; perspective:1400px;
}
.mascot-hero-wrap{
  width:min(70vw,320px); margin-bottom:6px; position:relative;
}
.mascot-hero{
  width:100%; display:block;
  -webkit-mask-image:radial-gradient(circle at 50% 46%, black 58%, transparent 82%);
  mask-image:radial-gradient(circle at 50% 46%, black 58%, transparent 82%);
  filter:drop-shadow(0 18px 34px rgba(0,0,0,0.45));
  animation:heroFloat 6s ease-in-out infinite;
  transform-style:preserve-3d;
}
@keyframes heroFloat{
  0%,100%{transform:translateY(0) rotate(-1.5deg);}
  50%{transform:translateY(-16px) rotate(1.5deg);}
}
.brand-eyebrow{
  font-family:'Baloo 2',sans-serif; letter-spacing:4px; text-transform:uppercase;
  font-size:13px; color:var(--gold); font-weight:700; margin:0 0 6px;
}
.select-title{
  font-family:'Baloo 2',sans-serif; font-weight:800; font-size:clamp(28px,6vw,42px);
  margin:0 0 8px; background:linear-gradient(90deg,#ffe8b8,#ffffff 45%,#ffd0f0);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  text-shadow:0 2px 24px rgba(255,255,255,0.15);
}
.select-sub{
  color:var(--text-dim); font-size:15px; margin:0 0 34px; max-width:380px;
}
.lang-grid{
  display:grid; grid-template-columns:repeat(2,minmax(140px,180px));
  gap:16px; max-width:420px; width:100%;
}
.lang-gem{
  position:relative; cursor:pointer; border:1px solid var(--glass-brd);
  background:linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02));
  backdrop-filter:blur(10px);
  border-radius:18px; padding:18px 10px 16px;
  color:var(--text); font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px;
  transform-style:preserve-3d; transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  box-shadow:0 10px 22px rgba(10,0,30,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
}
.lang-gem .flag{display:block; font-size:26px; margin-bottom:8px;}
.lang-gem:hover{
  transform:translateY(-6px) rotateX(6deg) rotateY(-4deg) scale(1.03);
  border-color:var(--gold); box-shadow:0 20px 30px rgba(230,150,60,0.25), inset 0 1px 0 rgba(255,255,255,0.35);
}
.lang-gem:active{transform:translateY(-1px) scale(0.98);}

/* ---------- APP SHELL ---------- */
#appScreen{max-width:760px; margin:0 auto; padding:22px 16px 60px; position:relative;}
.app-header{
  display:flex; align-items:center; gap:14px; margin-bottom:18px;
}
.mascot-logo{
  width:64px; height:64px; flex:0 0 auto;
  -webkit-mask-image:radial-gradient(circle at 50% 46%, black 55%, transparent 80%);
  mask-image:radial-gradient(circle at 50% 46%, black 55%, transparent 80%);
  filter:drop-shadow(0 6px 10px rgba(0,0,0,0.4));
}
.app-title{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:20px; margin:0; color:var(--cream);}
.app-subtitle{margin:2px 0 0; font-size:12.5px; color:var(--text-dim);}
.change-lang-btn{
  margin-left:auto; background:var(--glass); border:1px solid var(--glass-brd);
  color:var(--text); font-family:'Nunito',sans-serif; font-weight:700; font-size:12px;
  padding:9px 12px; border-radius:12px; cursor:pointer; white-space:nowrap;
  display:flex; align-items:center; gap:6px; transition:.2s;
}
.change-lang-btn:hover{border-color:var(--gold); background:rgba(255,255,255,0.12);}

.tabs{
  display:flex; gap:8px; margin:20px 0 20px; background:rgba(0,0,0,0.18);
  padding:6px; border-radius:16px; border:1px solid var(--glass-brd);
}
.tab-btn{
  flex:1; padding:12px 8px; text-align:center; border:none; cursor:pointer;
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14.5px;
  color:var(--text-dim); background:transparent; border-radius:12px; transition:.25s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.tab-btn .tab-ico{font-size:17px;}
.tab-btn.active{
  color:#3a1266; background:linear-gradient(160deg,#ffe8ae,#f6c65a 60%,#e8a13a);
  box-shadow:0 8px 18px rgba(230,150,60,0.4), inset 0 1px 0 rgba(255,255,255,0.6);
  transform:translateY(-1px);
}

.policy-title{
  font-family:'Baloo 2',sans-serif; font-size:22px; font-weight:800; margin:4px 2px 4px;
  color:var(--cream);
}
.policy-intro{color:var(--text-dim); font-size:13.5px; margin:0 2px 18px; line-height:1.5;}

/* ---------- CARDS ---------- */
.cards{display:flex; flex-direction:column; gap:14px; perspective:1200px;}
.rl-card{
  border-radius:var(--radius);
  background:linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02));
  border:1px solid var(--glass-brd);
  box-shadow:0 14px 28px rgba(8,0,25,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
  overflow:hidden;
  transform-style:preserve-3d;
  transition:transform .35s cubic-bezier(.2,.9,.3,1), box-shadow .35s ease, border-color .35s ease;
}
.rl-card.open{
  border-color:rgba(246,198,90,0.55);
  box-shadow:0 22px 40px rgba(214,59,176,0.22), 0 0 0 1px rgba(246,198,90,0.25), inset 0 1px 0 rgba(255,255,255,0.2);
}
.rl-card-head{
  width:100%; display:flex; align-items:center; gap:14px; padding:16px 18px;
  background:transparent; border:none; cursor:pointer; text-align:left; color:var(--text);
}
.card-num{
  font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13px; color:var(--ink);
  background:linear-gradient(160deg,#ffe8ae,#f6c65a); width:32px; height:32px; min-width:32px;
  border-radius:10px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(0,0,0,0.3);
}
.card-title{
  font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15.5px; flex:1; line-height:1.3;
}
.card-chevron{
  font-size:14px; color:var(--gold); transition:transform .3s ease; flex:0 0 auto;
}
.rl-card.open .card-chevron{transform:rotate(180deg);}
.rl-card-body{
  display:grid; grid-template-rows:0fr; transition:grid-template-rows .4s ease;
}
.rl-card.open .rl-card-body{grid-template-rows:1fr;}
.rl-card-inner{overflow:hidden;}
.rl-card-body > .rl-card-inner{padding:0 18px;}
.rl-card.open .rl-card-inner{padding:0 18px 20px;}

.sec-head{
  font-family:'Baloo 2',sans-serif; font-size:14px; font-weight:700; color:var(--gold);
  margin:16px 0 8px; padding-top:12px; border-top:1px dashed rgba(255,255,255,0.15);
}
.rl-card-inner > .sec-head:first-child, .rl-card-inner > *:first-child.sec-head{border-top:none; padding-top:2px; margin-top:14px;}
.sec-text{font-size:13.5px; line-height:1.6; color:var(--text-dim); margin:0 0 6px;}
.example-box{
  background:rgba(246,198,90,0.1); border-left:3px solid var(--gold);
  padding:10px 12px; border-radius:0 12px 12px 0; font-size:13px; color:var(--cream);
  margin:8px 0 4px;
}
.example-label{color:var(--gold); font-weight:800; margin-right:4px;}
.sec-list{margin:4px 0 4px; padding-left:20px; font-size:13.5px; line-height:1.65; color:var(--text-dim);}
.sec-list li{margin-bottom:6px;}
.sec-list b, .sec-text b{color:var(--cream);}
.table-wrap{overflow-x:auto; margin:6px 0 10px; border-radius:12px; border:1px solid var(--glass-brd);}
.rl-table{width:100%; border-collapse:collapse; font-size:12.8px; min-width:280px;}
.rl-table th{
  background:linear-gradient(160deg,#5a1f8f,#3a1266); color:var(--gold);
  text-align:left; padding:9px 12px; font-family:'Baloo 2',sans-serif; font-weight:700;
  white-space:nowrap;
}
.rl-table td{padding:9px 12px; color:var(--text-dim); border-top:1px solid rgba(255,255,255,0.08);}
.rl-table tr:nth-child(even) td{background:rgba(255,255,255,0.03);}
.rl-table td b{color:var(--cream);}

.footer-note{
  text-align:center; font-size:11.5px; color:rgba(255,255,255,0.4); margin-top:30px; line-height:1.6;
}
@media (max-width:420px){
  .lang-grid{grid-template-columns:repeat(2,1fr);}
  .app-title{font-size:17px;}
}
</style>
</head>
<body>
<div class="stage">

  <div id="langScreen">
    <div class="mascot-hero-wrap"><img class="mascot-hero" id="heroImg" alt="Rizz Live Mascot"></div>
    <p class="brand-eyebrow">Rizz Live</p>
    <h1 class="select-title" id="selectTitle">Select Your Language</h1>
    <p class="select-sub" id="selectSub">Choose a language to view the Host Policy</p>
    <div class="lang-grid" id="langGrid"></div>
  </div>

  <div id="appScreen" class="hidden">
    <div class="app-header">
      <img class="mascot-logo" id="logoImg" alt="Rizz Live mascot">
      <div>
        <p class="app-title" id="appTitle">Rizz Live Policy Hub</p>
        <p class="app-subtitle" id="appSubtitle">Tap a card to expand</p>
      </div>
      <button class="change-lang-btn" onclick="showLangScreen()">⬅ <span id="changeLangText">Back</span></button>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabVideoBtn" onclick="switchTab('video')"><span class="tab-ico">🎥</span><span id="tabVideoLabel">Video Policy</span></button>
      <button class="tab-btn" id="tabAudioBtn" onclick="switchTab('audio')"><span class="tab-ico">🎙️</span><span id="tabAudioLabel">Audio Policy</span></button>
    </div>

    <h2 class="policy-title" id="policyTitle"></h2>
    <p class="policy-intro" id="policyIntro"></p>
    <div class="cards" id="cardsContainer"></div>

    <p class="footer-note" id="footerNote"></p>
  </div>

</div>

const LANGS = [
  {code:'en', flag:'🇬🇧', name:'English'},
  {code:'es', flag:'🇪🇸', name:'Español'},
  {code:'pt', flag:'🇧🇷', name:'Português'},
  {code:'fil', flag:'🇵🇭', name:'Filipino'},
  {code:'uk', flag:'🇺🇦', name:'Українська'},
  {code:'ru', flag:'🇷🇺', name:'Русский'}
];

let currentLang = null;
let currentTab = 'video';

function buildLangGrid(){
  const grid = document.getElementById('langGrid');
  grid.innerHTML = LANGS.map(l => `
    <button class="lang-gem" onclick="selectLang('${l.code}')">
      <span class="flag">${l.flag}</span>${l.name}
    </button>
  `).join('');
}

function selectLang(code){
  currentLang = code;
  document.getElementById('langScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.remove('hidden');
  applyLang();
  renderCards();
}

function showLangScreen(){
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('langScreen').classList.remove('hidden');
}

function applyLang(){
  const ui = DATA[currentLang].ui;
  document.getElementById('selectTitle').textContent = ui.selectTitle;
  document.getElementById('selectSub').textContent = ui.selectSub;
  document.getElementById('appTitle').textContent = ui.appTitle;
  document.getElementById('appSubtitle').textContent = ui.appSubtitle;
  document.getElementById('changeLangText').textContent = ui.changeLang;
  document.getElementById('tabVideoLabel').textContent = ui.tabVideo;
  document.getElementById('tabAudioLabel').textContent = ui.tabAudio;
  document.getElementById('footerNote').textContent = ui.footer;
  document.documentElement.lang = currentLang;
}

function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabVideoBtn').classList.toggle('active', tab==='video');
  document.getElementById('tabAudioBtn').classList.toggle('active', tab==='audio');
  renderCards();
}

function renderSection(s){
  let h = '';
  if(s.type==='text'){
    if(s.heading) h += `<h4 class="sec-head">${s.heading}</h4>`;
    h += `<p class="sec-text">${s.text}</p>`;
  } else if(s.type==='example'){
    h += `<div class="example-box"><span class="example-label">${DATA[currentLang].ui.example}</span>${s.text}</div>`;
  } else if(s.type==='list'){
    if(s.heading) h += `<h4 class="sec-head">${s.heading}</h4>`;
    h += `<ul class="sec-list">${s.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  } else if(s.type==='table'){
    if(s.heading) h += `<h4 class="sec-head">${s.heading}</h4>`;
    h += `<div class="table-wrap"><table class="rl-table"><thead><tr>${s.headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }
  return h;
}

function renderCard(card, idx){
  return `
  <div class="rl-card" id="card-${idx}">
    <button class="rl-card-head" onclick="toggleCard(${idx})">
      <span class="card-num">${String(idx+1).padStart(2,'0')}</span>
      <span class="card-title">${card.title}</span>
      <span class="card-chevron">▾</span>
    </button>
    <div class="rl-card-body"><div class="rl-card-inner">${card.sections.map(renderSection).join('')}</div></div>
  </div>`;
}

function renderCards(){
  const set = DATA[currentLang][currentTab];
  document.getElementById('policyTitle').textContent = set.title;
  document.getElementById('policyIntro').textContent = set.intro;
  document.getElementById('cardsContainer').innerHTML = set.cards.map(renderCard).join('');
}

function toggleCard(idx){
  const card = document.getElementById('card-'+idx);
  const wasOpen = card.classList.contains('open');
  document.querySelectorAll('.rl-card.open').forEach(c => c.classList.remove('open'));
  if(!wasOpen){
    card.classList.add('open');
    setTimeout(()=> card.scrollIntoView({behavior:'smooth', block:'nearest'}), 200);
  }
}

// floating bubble decorations
(function spawnBubbles(){
  const sizes = [10,16,22,28,14,34];
  for(let i=0;i<6;i++){
    const b = document.createElement('div');
    b.className='bubble';
    const s = sizes[i];
    b.style.width = s+'px'; b.style.height = s+'px';
    b.style.left = (Math.random()*90+3)+'vw';
    b.style.top = (Math.random()*90+3)+'vh';
    b.style.animationDuration = (7+Math.random()*6)+'s';
    b.style.animationDelay = (Math.random()*4)+'s';
    document.body.appendChild(b);
  }
})();
