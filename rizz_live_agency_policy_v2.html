<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height: 100%;
  }

  @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
  @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }
  @keyframes logoGlow {
    0%,100%{box-shadow:0 4px 20px rgba(160,80,255,0.2),0 1px 4px rgba(0,0,0,0.08)}
    50%{box-shadow:0 8px 36px rgba(160,80,255,0.38),0 1px 4px rgba(0,0,0,0.08)}
  }
  @keyframes badgePulse {
    0%,100%{box-shadow:0 0 0 0 rgba(160,80,255,0.4)}
    60%{box-shadow:0 0 0 6px rgba(160,80,255,0)}
  }
  @keyframes accordionOpen { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }

  .page {
    background:#f5f3ff;
    padding:28px 16px 48px;
    font-family:'DM Sans',sans-serif;
    position:relative;
    overflow:hidden;

    /* FIX */
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }

  .blob { position:fixed; border-radius:50%; pointer-events:none; z-index:0; filter:blur(70px); opacity:0.32; }
  .blob-1 { width:300px;height:300px;background:#c084fc;top:-70px;right:-50px; }
  .blob-2 { width:260px;height:260px;background:#818cf8;bottom:-50px;left:-50px; }
  .blob-3 { width:180px;height:180px;background:#f9a8d4;top:45%;left:65%; }

  .wrap { position:relative;z-index:1;max-width:440px;margin:0 auto;width:100%; }

  /* (rest of your code EXACTLY SAME — untouched) */

</style>
</head>

<body>

<!-- KEEP EVERYTHING BELOW EXACTLY SAME -->

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="page">
  <div class="wrap">

    <!-- your full existing content unchanged -->

  </div>
</div>

<script>
function toggle(id) { document.getElementById(id).classList.toggle('open'); }
</script>

</body>
</html>
